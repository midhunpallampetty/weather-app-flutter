name: myfirst_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Weather app dependencies
  google_fonts: ^6.0.0       # Custom fonts
  http: ^1.2.0               # API requests
  shared_preferences: ^2.2.0 # Local storage
  provider: ^6.1.2           # State management
  flutter_spinkit: ^5.2.0    # Loading animations
  lottie: ^2.7.0             # Weather animations (optional)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/weather/
